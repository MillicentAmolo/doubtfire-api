<section class="container p-6">
  <h1>Forgot your password?</h1>
  <p>Enter your email address or username and we’ll send you a reset link.</p>
  <form (ngSubmit)="submit()" #form="ngForm" class="flex flex-col gap-4 max-w-md">
    <mat-form-field appearance="outline">
      <mat-label>Email or Username</mat-label>
      <input matInput name="emailOrUsername" [(ngModel)]="emailOrUsername" required />
    </mat-form-field>
    <button mat-flat-button color="primary" [disabled]="form.invalid || submitting">Send reset link</button>
  </form>
  <a uiSref="sign_in" class="mt-4 inline-block">Back to sign in</a>
</section>
