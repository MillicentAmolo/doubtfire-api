<section class="container p-6">
  <h1>Reset your password</h1>
  <form (ngSubmit)="submit()" #form="ngForm" class="flex flex-col gap-4 max-w-md">
    <mat-form-field appearance="outline">
      <mat-label>New password</mat-label>
      <input matInput type="password" name="password" [(ngModel)]="password" (ngModelChange)="onPasswordInput()" required />
      <mat-hint>Password strength: {{ strength }}</mat-hint>
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Confirm new password</mat-label>
      <input matInput type="password" name="confirm" [(ngModel)]="confirm" required />
    </mat-form-field>
    <button mat-flat-button color="primary" [disabled]="form.invalid || submitting">Reset password</button>
  </form>
  <a uiSref="sign_in" class="mt-4 inline-block">Back to sign in</a>
</section>
